x-platform-environment: &platform-environment
  APP_ENVIRONMENT: production
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  DATABASE_URL_FILE: /run/secrets/database_runtime_url
  REKA_API_KEY_FILE: /run/secrets/reka_api_key
  REKA_CHAT_BASE_URL: https://api.reka.ai/v1
  REKA_VISION_BASE_URL: https://vision-agent.api.reka.ai
  REKA_MODEL: ${REKA_MODEL:-reka-flash-3}
  REKA_VIDEO_MODEL: ${REKA_VIDEO_MODEL:-reka-edge-2603}
  REKA_VIDEO_PROMPT_VERSION: ${REKA_VIDEO_PROMPT_VERSION:-1.2.0}
  REKA_TIMEOUT_SECONDS: ${REKA_TIMEOUT_SECONDS:-120}
  REKA_PROVIDER_VERIFIED: ${REKA_PROVIDER_VERIFIED:-false}
  SYNTHETIC_DEMO_FORECASTS: ${SYNTHETIC_DEMO_FORECASTS:-false}
  # This dedicated hackathon composition enables only the built-in LADOTD HLS
  # source. The API request schema and capture adapter still reject every
  # client-supplied URL and unknown source key.
  PUBLIC_HLS_DEMO_ENABLED: ${PUBLIC_HLS_DEMO_ENABLED:-true}
  VIDEO_QUEUE_URL: ${VIDEO_QUEUE_URL:?Set VIDEO_QUEUE_URL}
  VIDEO_QUEUE_URL_UPLOAD: ${VIDEO_QUEUE_URL_UPLOAD:?Set VIDEO_QUEUE_URL_UPLOAD}
  VIDEO_QUEUE_URL_INDEX: ${VIDEO_QUEUE_URL_INDEX:?Set VIDEO_QUEUE_URL_INDEX}
  VIDEO_QUEUE_URL_ANALYZE: ${VIDEO_QUEUE_URL_ANALYZE:?Set VIDEO_QUEUE_URL_ANALYZE}
  VIDEO_QUEUE_URL_DELETE: ${VIDEO_QUEUE_URL_DELETE:?Set VIDEO_QUEUE_URL_DELETE}
  VIDEO_QUEUE_DLQ_URL: ${VIDEO_QUEUE_DLQ_URL:?Set VIDEO_QUEUE_DLQ_URL}
  VIDEO_QUEUE_DLQ_URL_UPLOAD: ${VIDEO_QUEUE_DLQ_URL_UPLOAD:?Set VIDEO_QUEUE_DLQ_URL_UPLOAD}
  VIDEO_QUEUE_DLQ_URL_INDEX: ${VIDEO_QUEUE_DLQ_URL_INDEX:?Set VIDEO_QUEUE_DLQ_URL_INDEX}
  VIDEO_QUEUE_DLQ_URL_ANALYZE: ${VIDEO_QUEUE_DLQ_URL_ANALYZE:?Set VIDEO_QUEUE_DLQ_URL_ANALYZE}
  VIDEO_QUEUE_DLQ_URL_DELETE: ${VIDEO_QUEUE_DLQ_URL_DELETE:?Set VIDEO_QUEUE_DLQ_URL_DELETE}
  VIDEO_MEDIA_BUCKET: ${VIDEO_MEDIA_BUCKET:?Set VIDEO_MEDIA_BUCKET}
  VIDEO_MEDIA_KMS_KEY_ID: ${VIDEO_MEDIA_KMS_KEY_ID:?Set VIDEO_MEDIA_KMS_KEY_ID}
  VIDEO_MEDIA_BUCKET_OWNER: ${VIDEO_MEDIA_BUCKET_OWNER:?Set VIDEO_MEDIA_BUCKET_OWNER}
  VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-8388608}
  LOCATION_SECRET_PREFIX: ${LOCATION_SECRET_PREFIX:?Set LOCATION_SECRET_PREFIX}
  VIDEO_WORKER_LEASE_SECONDS: ${VIDEO_WORKER_LEASE_SECONDS:-180}
  VIDEO_SPOOL_ROOT: /var/lib/crime-video-spool
  MODEL_REGISTRY_ROOT: /app/data/models

x-dispatch-environment: &dispatch-environment
  APP_ENVIRONMENT: production
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  DATABASE_URL_FILE: /run/secrets/database_runtime_url
  DISPATCH_MODE: ${DISPATCH_MODE:-mock}
  DISPATCH_QUEUE_URL: ${DISPATCH_QUEUE_URL:?Set DISPATCH_QUEUE_URL}
  DISPATCH_QUEUE_DLQ_URL: ${DISPATCH_QUEUE_DLQ_URL:?Set DISPATCH_QUEUE_DLQ_URL}
  DISPATCH_PUBLIC_BASE_URL: ${DISPATCH_PUBLIC_BASE_URL:?Set the public HTTPS API base URL}
  DISPATCH_TWILIO_SECRET_FILE: /run/secrets/twilio_voice
  DISPATCH_CONTACT_SECRET_PREFIX: ${DISPATCH_CONTACT_SECRET_PREFIX:?Set DISPATCH_CONTACT_SECRET_PREFIX}
  DISPATCH_CONTACT_KMS_KEY_ID: ${VIDEO_MEDIA_KMS_KEY_ID:?Set VIDEO_MEDIA_KMS_KEY_ID}
  DISPATCH_WORKER_LEASE_SECONDS: ${DISPATCH_WORKER_LEASE_SECONDS:-90}
  DISPATCH_MAX_CASES_PER_TENANT_DAY: ${DISPATCH_MAX_CASES_PER_TENANT_DAY:-20}
  DISPATCH_RETRY_SECONDS: ${DISPATCH_RETRY_SECONDS:-30}
  DISPATCH_EXTERNAL_CALLS_ENABLED: ${DISPATCH_EXTERNAL_CALLS_ENABLED:-false}
  DISPATCH_APPROVED_DESTINATION_SHA256: ${DISPATCH_APPROVED_DESTINATION_SHA256:-}

x-platform-service: &platform-service
  build:
    context: ../..
    dockerfile: docker/api.Dockerfile
  environment: *platform-environment
  secrets:
    - database_runtime_url
    - reka_api_key
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    command: ["crime-platform-migrate"]
    environment:
      APP_ENVIRONMENT: production
      DATABASE_MIGRATOR_URL_FILE: /run/secrets/database_migrator_url
      DATABASE_MIGRATOR_ROLE: crime_migrator
    secrets:
      - database_migrator_url
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    <<: *platform-service
    command:
      - sh
      - -c
      - >-
        exec uvicorn src.data.video.production_app:app
        --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2}
        --no-server-header --proxy-headers
    environment:
      <<: *platform-environment
      DISPATCH_MODE: ${DISPATCH_MODE:-mock}
      DISPATCH_QUEUE_URL: ${DISPATCH_QUEUE_URL:?Set DISPATCH_QUEUE_URL}
      DISPATCH_QUEUE_DLQ_URL: ${DISPATCH_QUEUE_DLQ_URL:?Set DISPATCH_QUEUE_DLQ_URL}
      DISPATCH_PUBLIC_BASE_URL: ${DISPATCH_PUBLIC_BASE_URL:?Set the public HTTPS API base URL}
      DISPATCH_TWILIO_SECRET_FILE: /run/secrets/twilio_voice
      DISPATCH_CONTACT_SECRET_PREFIX: ${DISPATCH_CONTACT_SECRET_PREFIX:?Set DISPATCH_CONTACT_SECRET_PREFIX}
      DISPATCH_CONTACT_KMS_KEY_ID: ${VIDEO_MEDIA_KMS_KEY_ID:?Set VIDEO_MEDIA_KMS_KEY_ID}
      DISPATCH_WORKER_LEASE_SECONDS: ${DISPATCH_WORKER_LEASE_SECONDS:-90}
      DISPATCH_MAX_CASES_PER_TENANT_DAY: ${DISPATCH_MAX_CASES_PER_TENANT_DAY:-20}
      DISPATCH_RETRY_SECONDS: ${DISPATCH_RETRY_SECONDS:-30}
      DISPATCH_TEST_CALLS_ENABLED: ${DISPATCH_TEST_CALLS_ENABLED:-false}
      DISPATCH_EXTERNAL_CALLS_ENABLED: ${DISPATCH_EXTERNAL_CALLS_ENABLED:-false}
      DISPATCH_APPROVED_DESTINATION_SHA256: ${DISPATCH_APPROVED_DESTINATION_SHA256:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to HTTPS origins}
      TRUSTED_HOSTS: localhost,127.0.0.1,${TRUSTED_HOSTS:?Set TRUSTED_HOSTS}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256}
      OIDC_MEMBERSHIPS_CLAIM: ${OIDC_MEMBERSHIPS_CLAIM:-tenant_memberships}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-9437184}
      API_WORKERS: ${API_WORKERS:-2}
    secrets:
      - database_runtime_url
      - reka_api_key
      - twilio_voice
    volumes:
      - ${MODEL_REGISTRY_HOST_PATH:?Mount the EFS model registry on the host}:/app/data/models
      - api-runtime:/app/data/runtime
      - video-spool:/var/lib/crime-video-spool
      - clamav-db:/var/lib/clamav:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav-updater:
        condition: service_healthy

  clamav-updater:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    command:
      - freshclam
      - --daemon
      - --foreground=true
      - --checks=12
      - --stdout
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Debian's freshclam configuration writes a log even when --stdout is
      # enabled. Keep the root filesystem immutable while giving the
      # unprivileged updater an ephemeral log directory.
      - /var/log/clamav:size=16m,mode=1777
    volumes:
      - clamav-db:/var/lib/clamav
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /var/lib/clamav/daily.cvd ||
          test -s /var/lib/clamav/daily.cld
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 90s

  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-}
        VITE_COGNITO_LOGOUT_URI: ${COGNITO_LOGOUT_URI:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  worker-upload:
    <<: *platform-service
    command: ["crime-video-worker", "--operation", "upload"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-index:
    <<: *platform-service
    command: ["crime-video-worker", "--operation", "index"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-analyze:
    <<: *platform-service
    command: ["crime-video-worker", "--operation", "analyze"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-delete:
    <<: *platform-service
    command: ["crime-video-worker", "--operation", "delete"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-dispatch:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    command: ["crime-dispatch-worker"]
    environment: *dispatch-environment
    secrets:
      - database_runtime_url
      - twilio_voice
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  database_runtime_url:
    file: ${DATABASE_RUNTIME_URL_SECRET_FILE:?Set DATABASE_RUNTIME_URL_SECRET_FILE}
  database_migrator_url:
    file: ${DATABASE_MIGRATOR_URL_SECRET_FILE:?Set DATABASE_MIGRATOR_URL_SECRET_FILE}
  reka_api_key:
    file: ${REKA_API_KEY_SECRET_FILE:?Set REKA_API_KEY_SECRET_FILE}
  twilio_voice:
    file: ${DISPATCH_TWILIO_SECRET_FILE:?Set DISPATCH_TWILIO_SECRET_FILE}

volumes:
  api-runtime:
  clamav-db:
  video-spool:
